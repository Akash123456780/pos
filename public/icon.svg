<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle grid pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Nexus Central Emblem (Stylized interconnected N/hexagon) -->
  <g filter="url(#glow)">
    <!-- Outer hexagonal node ring -->
    <path d="M 256 100 L 380 172 L 380 340 L 256 412 L 132 340 L 132 172 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Inner dynamic geometric N -->
    <path d="M 180 340 L 180 172 L 332 340 L 332 172" 
          fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Cyan data velocity diagonal -->
    <path d="M 210 205 L 302 307" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Central node cores -->
  <circle cx="180" cy="172" r="14" fill="#34d399"/>
  <circle cx="332" cy="172" r="14" fill="#38bdf8"/>
  <circle cx="180" cy="340" r="14" fill="#38bdf8"/>
  <circle cx="332" cy="340" r="14" fill="#34d399"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>

  <!-- Subtitle Text -->
  <text x="256" y="456" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
        font-size="30" 
        font-weight="900" 
        letter-spacing="9" 
        fill="#f8fafc" 
        text-anchor="middle">NEXUS OWNER</text>
</svg>
